# GSF stat-ID dictionary
#
# Maps the raw stat_id (u8) and prop_id (u16) bytes decoded from GSF
# `tal.spvp.*` and `abl.spvp.*` GOM payloads to plain-English labels and
# units. Loaded at compile time and applied during extraction so the
# `gsf_talent_stats` and `gsf_ability_stats` tables ship with decoded
# rows -- consumers query `WHERE label = 'cooldown_delta_seconds'`,
# never a raw hex byte.
#
# confidence values:
#   verified -- anchored against an in-game description string by Sean
#   guess    -- cross-referenced against huttspawn corrections, not yet
#               verified end-to-end
#   unknown  -- not in this file; populate emits label `unknown_0x<id>`
#               and confidence `unknown` so the row is still queryable
#
# Adding a new entry: verify the value against an in-game tooltip
# (huttspawn data/seed/gsf_*.sql is the validation oracle). Update the
# table here, run `cargo test --release --lib` (the populate functions
# load this at startup), re-extract spice.

# tal.spvp.* stat_id (u8) -- the byte before `01 04 <f32 LE>` in records
# anchored on the `cb 19 d7 4b ?? 03` signature.
[talent_stats]

