# abl.spvp.* prop_id (u16) -- u16 LE prop_id with high byte 0x04, followed
# by f32 LE value. Stat-ID semantics differ from `tal.spvp.*` -- 0x0402
# is cooldown for GSF base abilities, an animation marker for ground.
[ability_stats]

[ability_stats.0x0402]
label      = "cooldown_seconds"
unit       = "s"
confidence = "verified"
notes      = "barrel_roll = 30, power_dive = 15"

[ability_stats.0x0403]
label      = "scaling_factor"
unit       = "ratio"
confidence = "guess"
notes      = "Always 1.0 in samples; meaning unverified"

[ability_stats.0x0401]
label      = "cast_time_seconds"
unit       = "s"
confidence = "guess"
notes      = "Range observed -1.0..75.0; -1.0 likely passive marker"

[ability_stats.0x0421]
label      = "range_meters"
unit       = "m"
confidence = "guess"
notes      = "Range observed 15..150"

[ability_stats.0x0423]
label      = "duration_seconds"
unit       = "s"
confidence = "guess"
notes      = "Range observed 100..500"


# abl.* (ground ability) `0x04xx` prop_id (u16) labels for ability_stats.raw_props.
# These IDs land in dedicated columns when verified (cooldown / cast_time /
# channel_duration / hard_cast_time / force_cost / resource_cost). Other
# 0x04xx records hit raw_props -- this section gives them human labels so
# raw_props is keyed by `melee_range`/`is_knockback` instead of `0x041f`/`0x0421`.
[ground_ability_props]

