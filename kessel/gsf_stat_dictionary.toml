# --- FQN-prefix overrides ---
# Some stat_ids carry context-dependent semantics. The "default" label below is
# correct for the most common talents that emit the byte (e.g. shield.shield_projector
# uses 0x40 for cooldown_delta_seconds), but specific FQN families repurpose the
# slot for a domain-specific stat. When the talent's FQN starts with `fqn_prefix`,
# the populate function replaces the default label/unit/confidence with the
# override below.
[[talent_stat_overrides]]
fqn_prefix = "tal.spvp.minor_sensors.com_range"
stat_id    = "0x40"
label      = "comm_range_units"
unit       = "units"
confidence = "verified"
notes      = "minor_sensors.com_range.{base,upgrade} +40 / +20/+40/+60 units. The 0x40 slot defaults to cooldown_delta_seconds but for comm_range talents it's distance units"

[[talent_stat_overrides]]
fqn_prefix = "tal.spvp.crew.tactical.communications_range"
stat_id    = "0x40"
label      = "comm_range_units"
unit       = "units"
confidence = "verified"
notes      = "crew.tactical.communications_range (Comm Boost +50 units). Same 0x40-as-units repurposing as the minor_sensors.com_range talents"

[[talent_stat_overrides]]
fqn_prefix = "tal.spvp.minor_sensors.sensor_range"
stat_id    = "0x41"
label      = "sensor_range_duration_seconds"
unit       = "s"
confidence = "guess"
notes      = "minor_sensors.sensor_range.* carries BOTH 0x3f (sensor_range_units, the primary effect) and 0x41 with the same value scale. 0x41 normally encodes duration_extension_seconds for active abilities; for this passive its meaning is unclear but values align with the unit count (20/10/20/30). Treat as redundant pending verification"

[[talent_stat_overrides]]
fqn_prefix = "tal.spvp.crew.tactical.sensor_volume"
stat_id    = "0x41"
label      = "sensor_volume_units"
unit       = "units"
confidence = "verified"
notes      = "crew.tactical.sensor_volume (Depth of Field +35 units). The 0x41 slot defaults to duration_extension_seconds but this crew passive grants a sensor-volume bonus"


# abl.spvp.* prop_id (u16) -- u16 LE prop_id with high byte 0x04, followed
# by f32 LE value. Stat-ID semantics differ from `tal.spvp.*` -- 0x0402
# is cooldown for GSF base abilities, an animation marker for ground.
[ability_stats]

[ability_stats.0x0402]
label      = "cooldown_seconds"
unit       = "s"
confidence = "verified"
notes      = "barrel_roll = 30, power_dive = 15"

[ability_stats.0x0403]
label      = "scaling_factor"
unit       = "ratio"
confidence = "guess"
notes      = "53 of 55 rows are a vacuous 1.0 default (crew / shield / engine / mine / missile -- the prop is semantically empty there). The 2 real values are cooldown-gated drone weapons: drone.sentry_sniper.railgun=2.0 matches its summon text '...has a 2 second cooldown' exactly (and is distinct from 0x0402=180 lifetime and 0x041a=4.0 charge on the same ability); drone.sentry_missile.missile=12.0 is unconfirmable (blank text). So on those 2 abilities 0x0403 reads as a weapon cooldown in seconds -- but relabeling the prop to weapon_cooldown_seconds would FALSELY assert '1 second cooldown' on the 53 default rows, so the generic label is kept pending a per-FQN override that scopes the real meaning to the drone weapons. Finding 2026-06-16 (oracle pass)."

# 0x0401 (GSF) -- DOWNGRADED to unknown 2026-06-16 (was guess 'cast_time_seconds').
# Rank-1 (38 rows) is 100% sentinel: 20x 6.46924018859863 + 18x -1.0, zero real
# values (6.46924018859863 occurs ONLY on 0x0401, never cross-prop -- it is a
# 0x0401-local animation/uninit constant, not a shared marker). Rank-2 (13 rows) IS a
# distinct real stat (30/45/60/75 on systems abilities, confirmed != cooldown 0x0402)
# that resembles value/3 = duration seconds (60->20s, 45->15s, 75->25s, 30->10s) but is
# UNCONFIRMABLE: every rank-2 carrier ends in a blank duration token, no description
# number matches value or value/3. No entry -> populate emits unknown_0x0401. The
# rank-2 real stat is a tracked follow-up (anchor needs a non-blank duration source).

[ability_stats.0x0421]
label      = "range_units"
unit       = "100m"
confidence = "verified"
notes      = "Effect/proximity/trigger range in 100m units (value*100 = meters), same convention as verified 0x0407 -- but 0x0421 is the effect range and 0x0407 the weapon range, and no ability carries both. Text-anchored across 9 abilities (description-string oracle, verified 2026-06-16): mine.{concussion,interdiction,ion,seismic}_mine 15 -> 'explode if an enemy gets within 1500m' (4x convergence on the proximity-trigger number, not the larger blast radius); seeker_mine 40 -> 'within 4000m'; emp_field 45 -> '4500m radius'; face_target 150 -> 'within 15,000m' (decisive comma-formatted anchor); running_interference / wingman 30 -> 'within 3000m'. The 50.0 cluster (single-target crew debuffs, ion_burst / plasma_lance, remote_slicing) prints no range number -> 5000m plausible, unconfirmable, never contradictory. Lone outlier: shield_projector 0x0421=30 -> 3000m while its text prints a 5500m heal radius (55 is carried by no prop on that ability) -- scale-consistent, not a contradiction. Was 'range_meters' (off by 100x); corrected via adversarial oracle refutation."

[ability_stats.0x0423]
label      = "effect_archetype_id"
unit       = "enum"
confidence = "guess"
notes      = "GUESS (structural, 2026-06-16): an effect-behavior ARCHETYPE enum, NOT a magnitude. Verified against data: each value maps to a coherent EFFECT-BEHAVIOR class with zero within-class scatter -- but the key is behavior, NOT the FQN component segment. Observed (value=behavior class): 100=standard lock-on missile (8: cluster,concussion,ion,interdiction,graviton,hull,rocket_pod,target_tracker), 150=torpedo/special-payload missile (3: emp,proton,thermite), 180=timed crew buff (concentrated_fire), 360=sustained field/aura effect (6: interdiction_drive,tensor_field,aoe_def/off_boost,blaster_overcharge,hard_reset -- spans crew+engine+systems segments), 500=railgun (3). Note abl.spvp.missile.* SPLITS 100/150 and the 360 class spans 3 FQN segments, so this is NOT one-value-per-component-type. Not a magnitude (duration refuted -- tokens blank, values absurd as seconds; range refuted -- no 0x0407 co-occurs; damage refuted -- 20/21 values absent from own text). Same ladder as 0x0424. Labeled from internal pattern, not a description anchor -- hence guess, not verified."


